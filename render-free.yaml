# Free preview only: records on the temporary filesystem may reset.
services:
  - type: web
    name: veteran-preview
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /tmp/veteran-preview.sqlite
      - key: DEMO_MODE
        value: "true"
      - key: ADMIN_TOKEN
        generateValue: true
