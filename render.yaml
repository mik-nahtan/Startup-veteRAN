services:
  - type: web
    name: veteran-community
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/veteran.sqlite
      - key: ADMIN_TOKEN
        generateValue: true
    disk:
      name: veteran-data
      mountPath: /var/data
      sizeGB: 1
